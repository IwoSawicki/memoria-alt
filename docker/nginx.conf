# Erkennung mobiler Geraete.
#
# Die Originalseite ist nicht responsiv: Wix liefert je nach Geraetekennung
# zwei getrennte Fassungen aus — eine mit 980px Raster, eine mit 320px. Der
# Nachbau macht es genauso. Die Mobilfassung liegt unter public/m/, die
# Adresse bleibt dieselbe.
#
# Die Liste deckt Telefone ab, nicht Tablets. Das entspricht dem Original:
# ein iPad bekommt bei Wix die Desktop-Fassung.
map $http_user_agent $mobil {
    default                                                    "";
    "~*iphone|ipod|android.+mobile|windows phone|iemobile"      "/m";
    "~*blackberry|bb10|opera mini|opera mobi|webos|palm"        "/m";
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Saubere URLs: /leistungen liefert leistungen.html aus.
    # Die Original-Wix-Seite nutzt Pfade ohne Endung, damit bestehende Links
    # und Suchmaschinen-Eintraege weiter funktionieren.
    location / {
        # Erst die Mobilfassung, dann die Desktop-Fassung. Fehlt eine Seite
        # unter /m/, wird die Desktop-Fassung ausgeliefert — die Seite ist
        # also nie kaputt, hoechstens breiter als noetig.
        try_files $mobil$uri $mobil$uri.html $uri $uri.html $uri/ =404;
    }

    # Zwischenspeicher und Suchmaschinen muessen wissen, dass unter derselben
    # Adresse je nach Geraet Unterschiedliches ausgeliefert wird.
    add_header Vary "User-Agent" always;

    # Die Mobilfassung soll nicht zusaetzlich unter /m/ im Index landen —
    # sonst stuenden dieselben Inhalte doppelt in der Suche.
    location /m/ {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;

    # Inhaltstypen. Hier stand einmal ein eigener types-Block fuer AVIF — das
    # war ein Fehler: ein types-Block ERSETZT die Tabelle, er ergaenzt sie
    # nicht. Dadurch kannte nginx nur noch .avif, und alles andere, auch HTML,
    # ging als application/octet-stream raus. Der Browser hat die Seite dann
    # heruntergeladen statt sie anzuzeigen.
    #
    # Richtig ist, die mitgelieferte Tabelle einzubinden. AVIF ist dort seit
    # nginx 1.21 ohnehin enthalten.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Zeichensatz mitsenden. Die Seiten enthalten Umlaute, und ein fehlender
    # Zeichensatz im Kopf fuehrt bei manchen Proxys zu falscher Darstellung.
    charset utf-8;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript
                      image/svg+xml application/json;

    # Nur add_header verwenden, nicht zusaetzlich expires: beide setzen
    # Cache-Control, und die Kopfzeile ginge doppelt raus.
    location ~* \.(woff2|woff|ttf|otf)$ {
        add_header  Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        add_header  Cache-Control "public, max-age=604800" always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
}
