server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Saubere URLs: /leistungen liefert leistungen.html aus.
    # Die Original-Wix-Seite nutzt Pfade ohne Endung, damit bestehende Links
    # und Suchmaschinen-Eintraege weiter funktionieren.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # AVIF kennt nginx nicht von Haus aus. Wix liefert Bilder je nach Anfrage
    # als AVIF oder als JPEG aus, teils unter derselben Endung. Weiter unten
    # steht X-Content-Type-Options: nosniff — der Browser darf das Format also
    # nicht erraten, der Inhaltstyp muss stimmen.
    # Dafuer sorgt tools/build-images.py: es prueft jede Datei anhand ihrer
    # Signatur und benennt sie bei Bedarf um. Beides gehoert zusammen, also
    # nicht einzeln entfernen.
    types {
        image/avif  avif;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript
                      image/svg+xml application/json;

    location ~* \.(woff2|woff|ttf|otf)$ {
        expires     30d;
        add_header  Cache-Control "public, immutable";
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires     7d;
        add_header  Cache-Control "public";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
}
