server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Saubere URLs: /leistungen liefert leistungen.html aus.
    # Die Original-Wix-Seite nutzt Pfade ohne Endung, damit bestehende Links
    # und Suchmaschinen-Eintraege weiter funktionieren.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # AVIF wird von nginx nicht standardmaessig erkannt. Die Bilder aus dem
    # Wix-Export sind AVIF-kodiert, tragen aber .jpg/.png als Endung.
    types {
        image/avif  avif;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript
                      image/svg+xml application/json;

    location ~* \.(woff2|woff|ttf|otf)$ {
        expires     30d;
        add_header  Cache-Control "public, immutable";
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires     7d;
        add_header  Cache-Control "public";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
}
